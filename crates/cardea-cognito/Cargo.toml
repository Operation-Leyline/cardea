[package]
name = "cardea-cognito"
description = "The directory table, the Cognito admin calls, the trigger handler, linking, sign-in methods and the mail budget"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# What a function that sends mail needs: decrypting Cognito's custom email
# sender codes with the AWS Encryption SDK, and reading the mail budget's key
# from Secrets Manager. Off by default: other users need compile neither SDK.
email-sender = ["dep:aws-esdk", "dep:aws-sdk-kms", "dep:aws-sdk-secretsmanager"]
# What native provider sign-in needs to read its ticket key from Secrets
# Manager, in the trigger function and in the product's API service. Off by
# default; a product with a secrets layer of its own gives the key instead.
native-sign-in = ["dep:aws-sdk-secretsmanager"]

[dependencies]
cardea-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-cognitoidentityprovider = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# 1.130.0 is tabulary's API floor.
aws-sdk-dynamodb = { version = "1.130.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
tabulary = { git = "https://github.com/Operation-Leyline/tabulary", rev = "c554b5b16d07aeeb117cf0a3917233a9296507ee" }
lambda_runtime = "1.4"
tracing = "0.1"
base64 = "0.22"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
aws-esdk = { version = "=1.2.4", optional = true }
aws-sdk-kms = { version = "1.114.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }

[dev-dependencies]
# Tests build the optional parts too, so one `cargo test --workspace` covers
# them.
cardea-cognito = { path = ".", features = ["email-sender", "native-sign-in"] }
aws-lc-rs = "1"
axum = "0.8"
dynoxide-rs = { git = "https://github.com/Operation-Leyline/dynoxide", rev = "179e591fac34e362f0fbe40cbacc03f43f162a46", version = "=3.3.0", default-features = false, features = ["native-sqlite", "http-server"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
