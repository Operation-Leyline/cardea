name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust
    # GitHub-hosted runners do not start for this organization.
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cargo refuses a workspace without members, so every later step waits
      # for the first crate.
      - name: Look for crates
        id: crates
        run: |
          if compgen -G 'crates/*/Cargo.toml' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::No crates yet; skipping the Rust checks.'
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: steps.crates.outputs.present == 'true'
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.crates.outputs.present == 'true'

      - name: Format
        if: steps.crates.outputs.present == 'true'
        run: cargo fmt --check

      - name: Clippy
        if: steps.crates.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: steps.crates.outputs.present == 'true'
        run: cargo test --workspace

  node:
    name: Node
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build
      - run: pnpm -r --filter './packages/*' run typecheck
      - run: pnpm -r --filter './packages/*' run test
