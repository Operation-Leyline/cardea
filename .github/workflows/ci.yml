name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust
    # GitHub-hosted runners do not start for this organization.
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cargo refuses a workspace without members, so every later step waits
      # for the first crate.
      - name: Look for crates
        id: crates
        run: |
          if compgen -G 'crates/*/Cargo.toml' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::No crates yet; skipping the Rust checks.'
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: steps.crates.outputs.present == 'true'
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.crates.outputs.present == 'true'

      - name: Format
        if: steps.crates.outputs.present == 'true'
        run: cargo fmt --check

      - name: Clippy
        if: steps.crates.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: steps.crates.outputs.present == 'true'
        run: cargo test --workspace

  # The minimum supported Rust, `rust-version` in Cargo.toml. Release too:
  # whether a deeply nested future compiles can depend on the profile.
  rust-minimum:
    name: Rust 1.97.1 (${{ matrix.name }})
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            run: cargo test --workspace --all-features
          # The builds without tests leave out what dev-dependencies turn on,
          # as a product's own build does. The last has default features only.
          - name: release
            run: |
              cargo test --workspace --all-features --release
              cargo build --workspace --all-features --release
              cargo build --workspace --release
          # `downstream` stands for the Lambda a product deploys.
          - name: arm64
            run: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
              cargo build --workspace --all-features --release --bins --target aarch64-unknown-linux-gnu
              cargo build -p cardea-cognito --all-features --release --example downstream --target aarch64-unknown-linux-gnu
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}

      - name: Build and test
        run: ${{ matrix.run }}

  node:
    name: Node
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' run build
      - run: pnpm -r --filter './packages/*' run typecheck
      - run: pnpm -r --filter './packages/*' run test

  kotlin:
    name: Kotlin
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Android SDK is the runner image's own; Gradle fetches missing parts of it.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Also checks the Gradle wrapper jar against the published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      # Builds, lints and tests both modules, then checks that they publish.
      - run: ./gradlew build publish
